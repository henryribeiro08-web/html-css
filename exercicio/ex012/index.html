<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HTML5</title>
</head>
<body>
    <h1>Inserindo Videos hospedados localmente</h1>
    <p>Este video esta hospedado no meu proprio servidor</p>
    <video controls width="300" poster="imagem/Sem título.png">
        <source src="midia/meu-video.mp4.mp4" type="">
        <source src="midia/Meu-video.M4v.mp4" type="">
        <source src="midia/Meu-video.webm.mp4" type="">
        <source src="midia/Meu-video.ogg.mp4" type="">
        <p>Seu navegador não suporta o elemento de vídeo.</p>
    </video>

    <h1>Inserindo Videos do YouTube</h1>
    <iframe width="560" height="315" aria-controls="video-player" src="https://www.youtube.com/embed/2Kji_xZlCgw?si=E_Qed0xFkw750jgh" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <h1>Inserindo Videos do Vimeo</h1>
    <iframe src="https://player.vimeo.com/video/29315013?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" width="560" height="315" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" title="Animation Reel"></iframe>

</body>
</html>
