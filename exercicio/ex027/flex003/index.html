<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.conteiner{
            background-color: #ffa07a;
            display: flex;
            flex-flow: row wrap;
        }

        div.item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex: auto;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">Exemplo de flex A</div>
        <div class="item">Exemplo de flex B</div>
        <div class="item">Exemplo de flex C</div>
        <div class="item">Exemplo de flex D</div>
        <div class="item">Exemplo de flex E</div>
        <div class="item">Exemplo de flex F</div>
        <div class="item">Exemplo de flex G</div>
    </div>
</body>
</html>
