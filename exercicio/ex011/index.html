<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagens Dinâmicas</h1>
    <p>Tente abrir esse site em varios dispositivos diferentes ou simplismente aumenta o dimunua o tamanho do seu navegador</p>
    
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexivel">
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudio em HTML5</p>
    <audio preload="metadata" autoplay controls loop>
        <source src="midia/uWu Victory - Rod Kim.mp3" type="audio/mpeg">
        <source src="midia/uWu Victory - Rod Kim.ogg" type="audio/ogg">
        <source src="midia/uWu Victory - Rod Kim.wav" type="audio/wav">
        <p>Seu navegador não suporta a reprodução deste áudio. <a href="midia/uWu Victory - Rod Kim.mp3">Clique aqui para abaixar o audio mp3</a></p>
    </audio>
</body>
</html>
